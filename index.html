<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3ECDD" />
    <meta name="description" content="Onitama: a ceremonial duel between two schools. One phone, two players, no server." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preload" href="./fonts/shippori-mincho-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/zen-kaku-gothic-new-400.woff2" as="font" type="font/woff2" crossorigin />
    <title>Onitama</title>
    <script>
      // Set the saved theme before first paint, so night never flashes white.
      try {
        var theme = localStorage.getItem('onitama-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
